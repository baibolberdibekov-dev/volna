name: Check application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: docker build -t volna-test .
      - name: Check container
        run: |
          docker run -d --name volna-check -p 8000:8000 volna-test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health; then
              docker exec volna-check ffmpeg -version
              docker exec volna-check ffprobe -version
              docker exec volna-check deno --version
              exit 0
            fi
            sleep 2
          done
          docker logs volna-check
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f volna-check || true
